{% extends "base.html" %}

{% block title %}Log In | FoodBridge{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🍱</span>
                    <h3 class="fw-bold text-dark mt-2">Sign in to FoodBridge</h3>
                    <p class="text-secondary small">Access your donor, organization, or volunteer portal.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-dark small">Email Address</label>
                        <input type="email" class="form-control rounded-3 py-2" id="email" name="email" required placeholder="name@domain.com">
                    </div>
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label fw-semibold text-dark small">Password</label>
                        </div>
                        <input type="password" class="form-control rounded-3 py-2" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember" checked>
                        <label class="form-check-label text-secondary small" for="remember">Keep me logged in</label>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-3 shadow-sm mb-3">
                        Log In <i class="bi bi-box-arrow-in-right ms-1"></i>
                    </button>

                    <div class="text-center text-secondary small">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-semibold text-decoration-none">Join Network</a>
                    </div>
                </form>

                <!-- 1-Click Quick Demo Switcher -->
                <div class="mt-4 pt-3 border-top">
                    <div class="text-muted small fw-bold text-uppercase text-center mb-2" style="font-size: 0.7rem;">⚡ Quick Demo 1-Click Fill</div>
                    <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <button type="button" class="btn btn-outline-dark quick-login-btn" onclick="fillDemo('symposium@college.edu', 'donor123')">
                            🎓 Campus Donor
                        </button>
                        <button type="button" class="btn btn-outline-warning quick-login-btn text-dark" onclick="fillDemo('mercy@shelter.org', 'org123')">
                            🤝 Shelter NGO
                        </button>
                        <button type="button" class="btn btn-outline-info quick-login-btn text-dark" onclick="fillDemo('rahul@volunteer.org', 'vol123')">
                            🚴 Volunteer
                        </button>
                        <button type="button" class="btn btn-outline-danger quick-login-btn" onclick="fillDemo('admin@foodbridge.org', 'admin123')">
                            🛡️ Admin
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
