{% extends "base.html" %}

{% block title %}Sign In | FoodBridge{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <span class="fs-1">🍱</span>
                    <h3 class="fw-bold text-dark mt-2">Welcome Back</h3>
                    <p class="text-secondary small">Sign in to your FoodBridge portal</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-dark small">Email Address</label>
                        <input type="email" class="form-control rounded-3 py-2" id="email" name="email" required placeholder="name@organization.com">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold text-dark small">Password</label>
                        <input type="password" class="form-control rounded-3 py-2" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember" checked>
                        <label class="form-check-label text-secondary small" for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3">
                        Log In
                    </button>

                    <div class="text-center text-secondary small">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-semibold text-decoration-none">Sign Up</a>
                    </div>
                </form>

                <!-- Quick Demo Switcher -->
                <div class="mt-4 pt-3 border-top">
                    <div class="text-muted small fw-semibold text-center mb-2">Demo Accounts (1-Click Fill)</div>
                    <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <button type="button" class="btn btn-sm btn-outline-secondary quick-login-btn" onclick="fillDemo('symposium@college.edu', 'donor123')">
                            🎓 Donor
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary quick-login-btn" onclick="fillDemo('mercy@shelter.org', 'org123')">
                            🤝 Shelter
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary quick-login-btn" onclick="fillDemo('rahul@volunteer.org', 'vol123')">
                            🚴 Volunteer
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary quick-login-btn" onclick="fillDemo('admin@foodbridge.org', 'admin123')">
                            🛡️ Admin
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
