{% extends "base.html" %}

{% block title %}Post Food Deficit Request | FoodBridge{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h3 class="fw-bold text-dark mb-1"><i class="bi bi-megaphone-fill text-warning me-2"></i>Publish Community Food Need</h3>
                        <p class="text-secondary small mb-0">Broadcasts your real-time deficit to the public Food Need Heatmap and activates N:1 surplus pooling.</p>
                    </div>
                    <a href="{{ url_for('org.dashboard') }}" class="btn btn-sm btn-outline-secondary">Back</a>
                </div>

                <form method="POST" action="{{ url_for('org.post_need') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark text-uppercase">Target Meal Requirement Title</label>
                        <input type="text" class="form-control" name="title" required placeholder="e.g. Evening Community Dinner for Migrant Workers" value="Evening Community Meal Distribution">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark text-uppercase">Required Quantity (Meals)</label>
                            <input type="number" class="form-control" name="target_meals_required" required min="10" max="2000" value="200">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark text-uppercase">Needed Within</label>
                            <select class="form-select" name="hours_ahead">
                                <option value="2.0">Next 2 Hours (Urgent)</option>
                                <option value="3.5" selected>Next 3.5 Hours (Evening Drive)</option>
                                <option value="6.0">Next 6 Hours</option>
                                <option value="12.0">Tomorrow Morning</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark text-uppercase">Acceptable Food Category</label>
                            <select class="form-select" name="food_category">
                                <option value="cooked_meals" selected>Cooked Meals & Curries</option>
                                <option value="raw_groceries">Raw Groceries / Rations</option>
                                <option value="packaged">Packaged Food / Biscuits</option>
                                <option value="bakery_items">Bakery & Bread</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark text-uppercase">Dietary Preference</label>
                            <select class="form-select" name="dietary_preference">
                                <option value="any" selected>Any (Veg or Non-Veg)</option>
                                <option value="vegetarian">Strictly Vegetarian</option>
                                <option value="vegan">Vegan</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label small fw-bold text-dark text-uppercase mb-0">Distribution Center Location</label>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-xs btn-outline-danger fw-semibold" onclick="openLocationPickerModal('needLat', 'needLng', 'needLocation')">
                                    <i class="bi bi-map-fill me-1"></i> Pin on Map
                                </button>
                                <button type="button" class="btn btn-xs btn-outline-primary btn-gps-detect" data-lat-id="needLat" data-lng-id="needLng" data-addr-id="needLocation">
                                    <i class="bi bi-crosshair me-1"></i> High-Precision GPS
                                </button>
                            </div>
                        </div>
                        <input type="text" class="form-control mb-2" id="needLocation" name="location_name" required value="{{ current_user.addresses.first().street_address if current_user.addresses.first() else 'Saidapet Shelter Wing' }}">
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="number" step="0.000001" class="form-control form-control-sm" id="needLat" name="latitude" value="{{ current_user.addresses.first().latitude if current_user.addresses.first() else 13.0827 }}">
                            </div>
                            <div class="col-6">
                                <input type="number" step="0.000001" class="form-control form-control-sm" id="needLng" name="longitude" value="{{ current_user.addresses.first().longitude if current_user.addresses.first() else 80.2707 }}">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning btn-lg w-100 py-3 text-dark fw-bold rounded-3 shadow">
                        Publish to Food Need Heatmap <i class="bi bi-broadcast ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
